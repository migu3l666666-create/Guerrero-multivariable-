<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>⚔️ GUERRERO ASCENDENTE | CÁLCULO AVANZADO ⚔️</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0c15 0%, #14182b 50%, #0a0c15 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: linear-gradient(145deg, #12172b, #0a0e1c);
            border-radius: 80px;
            padding: 25px;
            box-shadow: 0 35px 60px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.1);
            border: 1px solid rgba(255,215,0,0.4);
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 56px;
            box-shadow: 0 0 0 8px #1f1a12, 0 25px 50px black;
            background: radial-gradient(ellipse at 30% 40%, #1a2a1a, #0a1a0a);
            cursor: crosshair;
        }

        .ui-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
            gap: 20px;
            flex-wrap: wrap;
            background: rgba(5,8,18,0.9);
            backdrop-filter: blur(16px);
            padding: 12px 32px;
            border-radius: 100px;
            border: 1px solid rgba(255,193,69,0.5);
        }

        .level-badge, .correct-counter {
            background: linear-gradient(135deg, #1f1508, #120c04);
            padding: 8px 24px;
            border-radius: 60px;
            color: #ffdfa5;
            font-weight: bold;
            font-size: 22px;
            font-family: monospace;
            box-shadow: inset 0 -1px 0 #b8860b, 0 5px 15px black;
            border-left: 2px solid #ffaa33;
        }

        .level-badge span, .correct-counter span {
            color: #ffcc55;
            font-size: 34px;
            font-weight: bold;
            text-shadow: 0 0 8px #ff9900;
        }

        button {
            background: linear-gradient(135deg, #c2410c, #9b2c0c);
            border: none;
            font-family: inherit;
            font-weight: bold;
            font-size: 18px;
            padding: 8px 30px;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 #5a1e0a;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #5a1e0a;
        }

        .question-area {
            background: rgba(2,5,10,0.85);
            margin-top: 16px;
            border-radius: 60px;
            padding: 12px 28px;
            display: flex;
            justify-content: center;
            gap: 30px;
            align-items: center;
            flex-wrap: wrap;
            backdrop-filter: blur(12px);
            border: 1px solid #e6b87a;
        }

        .math-text {
            font-size: 26px;
            font-weight: bold;
            background: linear-gradient(135deg, #fff5e0, #ffe0b5);
            padding: 12px 25px;
            border-radius: 90px;
            color: #2c4b1e;
            font-family: 'Courier New', monospace;
            box-shadow: inset 0 0 0 4px #deb887, 0 8px 20px black;
            text-align: center;
        }

        .answer-input {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .answer-input input {
            font-size: 24px;
            width: 500px;
            text-align: center;
            border-radius: 70px;
            border: none;
            background: #fff8e7;
            font-family: monospace;
            font-weight: bold;
            padding: 10px 18px;
            outline: none;
            box-shadow: inset 0 0 0 3px #b8860b, 0 5px 12px black;
        }

        .answer-input button {
            font-size: 22px;
            padding: 10px 28px;
            background: linear-gradient(135deg, #2ecc71, #229954);
            box-shadow: 0 6px 0 #1b6b3a;
        }

        .math-keyboard {
            background: rgba(10,15,25,0.95);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 15px;
            margin-top: 12px;
            border: 1px solid #ffcc77;
            max-height: 320px;
            overflow-y: auto;
        }

        .keyboard-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .key-btn {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border: none;
            color: #ffdd99;
            font-family: monospace;
            font-weight: bold;
            font-size: 15px;
            padding: 8px 10px;
            border-radius: 35px;
            cursor: pointer;
            transition: 0.05s linear;
            box-shadow: 0 3px 0 #0f1119;
            min-width: 50px;
        }

        .key-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f1119;
        }

        .key-special {
            background: linear-gradient(135deg, #c2410c, #8b2c0c);
            color: white;
        }

        .key-function {
            background: linear-gradient(135deg, #1e6b5e, #0f4a3f);
            color: #aaffdd;
        }

        .message-box {
            background: rgba(0,0,0,0.8);
            color: #ffe5b4;
            border-radius: 48px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            margin-top: 12px;
            backdrop-filter: blur(12px);
            border: 1px solid #ffcc77;
        }

        @media (max-width: 950px) {
            .math-text { font-size: 14px; padding: 8px 12px;}
            .answer-input input { font-size: 14px; width: 220px;}
            .key-btn { font-size: 11px; padding: 5px 6px; min-width: 40px;}
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <canvas id="gameCanvas" width="1050" height="550"></canvas>
        
        <div class="ui-panel">
            <div class="level-badge">🌟 NIVEL GUERRERO: <span id="levelValue">1</span></div>
            <div class="correct-counter">🏆 ACIERTOS: <span id="correctCount">0</span> / 5</div>
            <button id="resetGameBtn">🌀 RENACER ASCENDENTE 🌀</button>
        </div>

        <div class="question-area">
            <div class="math-text" id="mathQuestion">∂/∂x (x²y + y³) = ?</div>
            <div class="answer-input">
                <input type="text" id="answerInput" placeholder="Escribe o usa la calculadora científica" value="">
                <button id="submitAnswer">🗡️ RESPONDER 🗡️</button>
            </div>
        </div>

        <!-- CALCULADORA CIENTÍFICA MEJORADA -->
        <div class="math-keyboard" id="mathKeyboard">
            <div class="keyboard-row">
                <button class="key-btn" data-value="7">7</button>
                <button class="key-btn" data-value="8">8</button>
                <button class="key-btn" data-value="9">9</button>
                <button class="key-btn" data-value="/">/</button>
                <button class="key-btn key-function" data-value="sen">sen</button>
                <button class="key-btn key-function" data-value="cos">cos</button>
                <button class="key-btn key-function" data-value="tan">tan</button>
            </div>
            <div class="keyboard-row">
                <button class="key-btn" data-value="4">4</button>
                <button class="key-btn" data-value="5">5</button>
                <button class="key-btn" data-value="6">6</button>
                <button class="key-btn" data-value="*">*</button>
                <button class="key-btn key-function" data-value="cot">cot</button>
                <button class="key-btn key-function" data-value="sec">sec</button>
                <button class="key-btn key-function" data-value="csc">csc</button>
            </div>
            <div class="keyboard-row">
                <button class="key-btn" data-value="1">1</button>
                <button class="key-btn" data-value="2">2</button>
                <button class="key-btn" data-value="3">3</button>
                <button class="key-btn" data-value="-">-</button>
                <button class="key-btn key-function" data-value="ln">ln</button>
                <button class="key-btn key-function" data-value="log">log</button>
                <button class="key-btn" data-value="√">√</button>
            </div>
            <div class="keyboard-row">
                <button class="key-btn" data-value="0">0</button>
                <button class="key-btn" data-value=".">.</button>
                <button class="key-btn" data-value="+">+</button>
                <button class="key-btn" data-value="=">=</button>
                <button class="key-btn" data-value="^">^</button>
                <button class="key-btn" data-value="²">²</button>
                <button class="key-btn" data-value="³">³</button>
            </div>
            <div class="keyboard-row">
                <button class="key-btn" data-value="(">(</button>
                <button class="key-btn" data-value=")">)</button>
                <button class="key-btn" data-value="x">x</button>
                <button class="key-btn" data-value="y">y</button>
                <button class="key-btn" data-value="t">t</button>
                <button class="key-btn key-function" data-value="e">e</button>
                <button class="key-btn key-function" data-value="π">π</button>
            </div>
            <div class="keyboard-row">
                <button class="key-btn key-function" data-value="∂">∂</button>
                <button class="key-btn key-function" data-value="∇">∇</button>
                <button class="key-btn key-function" data-value="·">·</button>
                <button class="key-btn key-function" data-value="√2">√2</button>
                <button class="key-btn key-function" data-value="sec²">sec²</button>
                <button class="key-btn key-function" data-value="cos²">cos²</button>
            </div>
            <div class="keyboard-row">
                <button class="key-btn key-special" id="keyClear">🗑️ CLEAR</button>
                <button class="key-btn key-special" id="keyBack">⌫ BORRAR</button>
                <button class="key-btn key-special" id="keySpace">␣ ESPACIO</button>
            </div>
        </div>

        <div class="message-box" id="messageBox">
            🔬 CÁLCULO AVANZADO: DERIVADAS PARCIALES, DIRECCIONALES Y REGLA DE LA CADENA
        </div>
    </div>
</div>

<script>
    (function(){
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const levelSpan = document.getElementById('levelValue');
        const correctCountSpan = document.getElementById('correctCount');
        const resetBtn = document.getElementById('resetGameBtn');
        const mathQuestionDiv = document.getElementById('mathQuestion');
        const answerInput = document.getElementById('answerInput');
        const submitBtn = document.getElementById('submitAnswer');
        const messageBox = document.getElementById('messageBox');
        
        const CW = 1050, CH = 550;
        canvas.width = CW; canvas.height = CH;
        
        // ==================== BANCO DE 15 EJERCICIOS (TODAS LAS RESPUESTAS CORRECTAS CON PARÉNTESIS) ====================
        // 5 DERIVADAS PARCIALES
        const derivadasParciales = [
            { texto: "∂/∂x (x²y + y³)", respuesta: "2xy" },
            { texto: "∂/∂y (x²y + y³)", respuesta: "x² + 3y²" },
            { texto: "∂/∂x (sen(xy))", respuesta: "y·cos(xy)" },
            { texto: "∂/∂y (e^(x²y))", respuesta: "x²·e^x²y" },
            { texto: "∂²/∂x² (x³y²)", respuesta: "6xy²" }
        ];
        
        // 5 DERIVADAS DIRECCIONALES
        const derivadasDireccionales = [
            { texto: "D_u f(x,y) = ∇f·u, f(x,y)=x²+y², u=(1,0)", respuesta: "2x" },
            { texto: "D_u f(x,y) = ∇f·u, f(x,y)=xy, u=(0,1)", respuesta: "x" },
            { texto: "Derivada direccional de f(x,y)=x²y en dirección (1,1) normalizado", respuesta: "2xy + x² / √2" },
            { texto: "∇f·u con f(x,y)=e^(xy), u=(1/√2,1/√2)", respuesta: "y·e^xy + x·e^xy / √2" },
            { texto: "Derivada direccional de f(x,y)=ln(x²+y²) en dirección (1,0)", respuesta: "2x / x²+y²" }
        ];
        
        // 5 REGLA DE LA CADENA (TODAS LAS RESPUESTAS CON PARÉNTESIS CORRECTOS)
        const reglaCadena = [
            { texto: "d/dt (sen(t²))", respuesta: "2t·cos(t²)" },
            { texto: "d/dt (e^(cos t))", respuesta: "-sen(t)·e^cos(t)" },
            { texto: "d/dx (ln(sen x))", respuesta: "cot(x)" },
            { texto: "d/dx (cos(e^x))", respuesta: "-e^x·sen(e^x)" },
            { texto: "d/dt (tan(3t²))", respuesta: "6t·sec²(3t²)" }
        ];
        
        // COMBINAR LOS 15 EJERCICIOS
        const bancoEjercicios = [...derivadasParciales, ...derivadasDireccionales, ...reglaCadena];
        
        // FUNCIÓN PARA SELECCIONAR 5 EJERCICIOS ALEATORIOS
        function seleccionarEjerciciosAleatorios() {
            let copia = [...bancoEjercicios];
            for (let i = copia.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copia[i], copia[j]] = [copia[j], copia[i]];
            }
            return copia.slice(0, 5);
        }
        
        let ejercicios = [];
        let indiceActual = 0;
        let aciertos = 0;
        let gamePhase = "questions";
        let battleResult = null;
        let warriorLevel = 1;
        let monsterDefeated = false;
        let warriorDead = false;
        
        function normalizarRespuesta(resp) {
            let r = resp.toLowerCase().trim();
            r = r.replace(/·/g, '*');
            r = r.replace(/×/g, '*');
            r = r.replace(/sen/g, 'sin');
            r = r.replace(/cos/g, 'cos');
            r = r.replace(/tan/g, 'tan');
            r = r.replace(/cot/g, 'cot');
            r = r.replace(/sec/g, 'sec');
            r = r.replace(/csc/g, 'csc');
            r = r.replace(/ln/g, 'log');
            r = r.replace(/√/g, 'sqrt');
            r = r.replace(/\s/g, '');
            r = r.replace(/²/g, '^2');
            r = r.replace(/³/g, '^3');
            r = r.replace(/∂/g, 'd');
            r = r.replace(/∇/g, 'grad');
            r = r.replace(/e\^/g, 'e');
            return r;
        }
        
        function compararRespuestas(usuario, correcta) {
            let normUsuario = normalizarRespuesta(usuario);
            let normCorrecta = normalizarRespuesta(correcta);
            console.log("Usuario norm:", normUsuario);
            console.log("Correcta norm:", normCorrecta);
            return normUsuario === normCorrecta;
        }
        
        function reiniciarJuego() {
            ejercicios = seleccionarEjerciciosAleatorios();
            indiceActual = 0;
            aciertos = 0;
            gamePhase = "questions";
            battleResult = null;
            warriorLevel = 1;
            monsterDefeated = false;
            warriorDead = false;
            actualizarUI();
            mostrarPregunta();
            messageBox.innerHTML = "⚡ RENACISTE. RESUELVE 5 EJERCICIOS DE CÁLCULO AVANZADO (PARCIALES, DIRECCIONALES, CADENA) ⚡";
            answerInput.disabled = false;
            submitBtn.disabled = false;
            answerInput.value = "";
            answerInput.focus();
            dibujar();
        }
        
        function actualizarUI() {
            levelSpan.innerText = warriorLevel;
            correctCountSpan.innerText = `${aciertos} / 5`;
        }
        
        function mostrarPregunta() {
            if(indiceActual < ejercicios.length) {
                mathQuestionDiv.innerHTML = ejercicios[indiceActual].texto;
                answerInput.value = "";
                answerInput.focus();
            }
        }
        
        function evaluarRespuesta() {
            if(gamePhase !== "questions") {
                messageBox.innerHTML = "💀 LA BATALLA TERMINÓ. RENACE PARA SEGUIR LUCHANDO 💀";
                return;
            }
            if(indiceActual >= ejercicios.length) return;
            
            let respuestaUsuario = answerInput.value.trim();
            if(respuestaUsuario === "") {
                messageBox.innerHTML = "❌ INGRESA LA RESPUESTA, GUERRERO ❌";
                return;
            }
            
            let ejercicioActual = ejercicios[indiceActual];
            let esCorrecto = compararRespuestas(respuestaUsuario, ejercicioActual.respuesta);
            
            if(esCorrecto) {
                aciertos++;
                warriorLevel = Math.min(5, aciertos);
                messageBox.innerHTML = `✨ ¡RESPUESTA CORRECTA! ASCIENDES AL NIVEL ${warriorLevel} ✨`;
                actualizarUI();
            } else {
                messageBox.innerHTML = `💔 ERROR... LA RESPUESTA DE ${ejercicioActual.texto} es ${ejercicioActual.respuesta} 💔`;
            }
            
            indiceActual++;
            
            if(indiceActual < ejercicios.length) {
                mostrarPregunta();
            } else {
                terminarCuestionario();
            }
            dibujar();
            answerInput.focus();
        }
        
        function terminarCuestionario() {
            gamePhase = "battle";
            if(aciertos >= 3) {
                battleResult = "win";
                monsterDefeated = true;
                warriorDead = false;
                messageBox.innerHTML = `🏆✨ ¡VICTORIA ÉPICA! CON ${aciertos}/5 CORRECTAS, EL COLOSO HA CAÍDO. ✨🏆`;
            } else {
                battleResult = "lose";
                monsterDefeated = false;
                warriorDead = true;
                messageBox.innerHTML = `💀💀 DERROTA... SOLO ${aciertos}/5 ACIERTOS. EL GUERRERO HA CAÍDO. 💀💀`;
            }
            answerInput.disabled = true;
            submitBtn.disabled = true;
            mathQuestionDiv.innerHTML = battleResult === "win" ? "🏅 ¡MAESTRO DEL CÁLCULO AVANZADO! 🏅" : "💀 FRACASÓ EN EL CÁLCULO 💀";
            dibujar();
        }
        
        // ==================== CONFIGURACIÓN TECLADO ====================
        function setupMathKeyboard() {
            const keys = document.querySelectorAll('.key-btn[data-value]');
            keys.forEach(key => {
                key.addEventListener('click', () => {
                    if (gamePhase !== "questions") return;
                    const value = key.getAttribute('data-value');
                    if (value === '=') {
                        evaluarRespuesta();
                        dibujar();
                    } else {
                        answerInput.value += value;
                    }
                    answerInput.focus();
                });
            });
            
            document.getElementById('keyClear').addEventListener('click', () => {
                if (gamePhase !== "questions") return;
                answerInput.value = '';
                answerInput.focus();
            });
            
            document.getElementById('keyBack').addEventListener('click', () => {
                if (gamePhase !== "questions") return;
                answerInput.value = answerInput.value.slice(0, -1);
                answerInput.focus();
            });
            
            document.getElementById('keySpace').addEventListener('click', () => {
                if (gamePhase !== "questions") return;
                answerInput.value += ' ';
                answerInput.focus();
            });
        }
        
        // ==================== FONDO: BOSQUE + CIELO ESTRELLADO ====================
        
        function dibujarEscenario() {
            let gradSky = ctx.createLinearGradient(0, 0, 0, CH*0.6);
            gradSky.addColorStop(0, "#0a0a2a");
            gradSky.addColorStop(0.4, "#1a1a4a");
            gradSky.addColorStop(0.8, "#1a2a2a");
            ctx.fillStyle = gradSky;
            ctx.fillRect(0, 0, CW, CH);
            
            for(let i = 0; i < 250; i++) {
                let brillo = Math.random() * 0.6 + 0.3;
                let tamaño = Math.random() * 2 + 0.8;
                ctx.fillStyle = `rgba(255, 255, 200, ${brillo})`;
                ctx.beginPath();
                ctx.arc( (i * 131) % CW, (i * 57) % (CH * 0.55), tamaño, 0, Math.PI * 2);
                ctx.fill();
            }
            
            for(let i = 0; i < 40; i++) {
                ctx.fillStyle = `rgba(255, 240, 180, 0.9)`;
                ctx.beginPath();
                ctx.arc( (i * 223) % CW, (i * 89) % (CH * 0.5), 2.2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.fillStyle = "#ff4466";
            ctx.shadowBlur = 45;
            ctx.shadowColor = "#ff0000";
            ctx.beginPath();
            ctx.arc(CW-90, 60, 42, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#aa3355";
            ctx.beginPath();
            ctx.arc(CW-80, 50, 12, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.fillStyle = "rgba(40, 40, 60, 0.3)";
            ctx.beginPath();
            ctx.ellipse(150, 45, 60, 25, 0, 0, Math.PI*2);
            ctx.ellipse(210, 38, 70, 28, 0, 0, Math.PI*2);
            ctx.ellipse(280, 48, 55, 22, 0, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = "#1a2a1a";
            ctx.beginPath();
            ctx.moveTo(0, CH-130);
            ctx.lineTo(120, CH-190);
            ctx.lineTo(260, CH-170);
            ctx.lineTo(400, CH-215);
            ctx.lineTo(550, CH-185);
            ctx.lineTo(700, CH-225);
            ctx.lineTo(850, CH-195);
            ctx.lineTo(CW, CH-210);
            ctx.lineTo(CW, CH);
            ctx.lineTo(0, CH);
            ctx.fill();
            
            ctx.fillStyle = "#2a4a2a";
            for(let i = 0; i < 25; i++) {
                let treeX = (i * 45) % CW;
                let treeY = CH - 115 - Math.sin(i) * 15;
                ctx.fillRect(treeX - 8, treeY - 35, 16, 45);
                ctx.fillStyle = "#3a6a3a";
                ctx.beginPath();
                ctx.ellipse(treeX, treeY - 48, 18, 32, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#2a4a2a";
            }
            
            for(let i = 0; i < 15; i++) {
                let treeX = 30 + (i * 70) % (CW - 100);
                ctx.fillStyle = "#3a2a1a";
                ctx.fillRect(treeX - 10, CH - 125, 20, 55);
                ctx.fillStyle = "#2a6a2a";
                ctx.beginPath();
                ctx.ellipse(treeX, CH - 145, 28, 42, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#1a4a1a";
                ctx.beginPath();
                ctx.ellipse(treeX - 8, CH - 158, 20, 32, 0, 0, Math.PI*2);
                ctx.fill();
            }
            
            ctx.fillStyle = "#2a3a1a";
            ctx.fillRect(0, CH-85, CW, 85);
            for(let i=0;i<40;i++) {
                ctx.fillStyle = "#4a6a3a";
                ctx.fillRect(i*35, CH-88, 18, 8);
            }
            
            ctx.fillStyle = "#5a8a3a";
            for(let i=0;i<60;i++) {
                let grassX = (i * 28) % CW;
                ctx.beginPath();
                ctx.moveTo(grassX, CH-88);
                ctx.lineTo(grassX+5, CH-105);
                ctx.lineTo(grassX-5, CH-105);
                ctx.fill();
            }
            
            ctx.fillStyle = "rgba(80, 100, 80, 0.15)";
            ctx.fillRect(0, CH-100, CW, 100);
        }
        
        // ==================== GUERRERO ÉPICO ====================
        function dibujarGuerrero(x, y, nivel, muerto) {
            if(muerto) {
                ctx.save();
                ctx.globalAlpha = 0.9;
                ctx.fillStyle = "#3a2a1a";
                ctx.fillRect(x-28, y+12, 60, 38);
                ctx.fillStyle = "#8a6a4a";
                ctx.beginPath();
                ctx.ellipse(x, y+20, 24, 30, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x-18, y+6);
                ctx.lineTo(x-4, y+20);
                ctx.moveTo(x-4, y+6);
                ctx.lineTo(x-18, y+20);
                ctx.moveTo(x+8, y+6);
                ctx.lineTo(x+22, y+20);
                ctx.moveTo(x+22, y+6);
                ctx.lineTo(x+8, y+20);
                ctx.lineWidth = 5;
                ctx.strokeStyle = "#ff0000";
                ctx.stroke();
                ctx.font = "bold 32px monospace";
                ctx.fillStyle = "#883333";
                ctx.fillText("💀", x-12, y-8);
                ctx.restore();
                return;
            }
            
            ctx.save();
            ctx.shadowBlur = 12;
            ctx.shadowColor = "rgba(0,0,0,0.7)";
            
            if(nivel === 1) {
                ctx.fillStyle = "#8b7355";
                ctx.fillRect(x-22, y-42, 44, 58);
                ctx.fillStyle = "#dbb87c";
                ctx.beginPath();
                ctx.ellipse(x, y-52, 18, 22, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#6b4c3a";
                ctx.fillRect(x-14, y-68, 28, 18);
                ctx.fillStyle = "#c0a070";
                ctx.fillRect(x+14, y-52, 7, 38);
                ctx.font = "bold 16px monospace";
                ctx.fillStyle = "#ffffaa";
                ctx.fillText("ESCUDERO", x-32, y-85);
            }
            else if(nivel === 2) {
                ctx.fillStyle = "#a0a0a0";
                ctx.fillRect(x-24, y-44, 48, 62);
                for(let i=0;i<3;i++) ctx.fillStyle = "#dddddd", ctx.fillRect(x-14+i*14, y-36, 5, 28);
                ctx.fillStyle = "#c0c0c0";
                ctx.beginPath();
                ctx.ellipse(x, y-56, 20, 24, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#4a7080";
                ctx.fillRect(x-16, y-76, 32, 22);
                ctx.fillStyle = "#b0b0b0";
                ctx.fillRect(x+16, y-55, 8, 42);
                ctx.fillStyle = "#aa8844";
                ctx.beginPath();
                ctx.ellipse(x-28, y-42, 12, 18, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.font = "bold 16px monospace";
                ctx.fillStyle = "#ddddff";
                ctx.fillText("CABALLERO", x-38, y-95);
            }
            else if(nivel === 3) {
                ctx.fillStyle = "#c9a03d";
                ctx.fillRect(x-26, y-46, 52, 66);
                for(let i=0;i<4;i++) ctx.fillStyle = "#ffdd77", ctx.fillRect(x-16+i*11, y-38, 4, 30);
                ctx.fillStyle = "#eebb55";
                ctx.beginPath();
                ctx.ellipse(x, y-60, 22, 26, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#ffcc66";
                ctx.fillRect(x-18, y-82, 36, 24);
                ctx.fillStyle = "#ffaa33";
                ctx.fillRect(x+18, y-58, 10, 48);
                ctx.fillStyle = "#ccaa55";
                ctx.beginPath();
                ctx.ellipse(x-32, y-44, 15, 22, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#ffcc88";
                ctx.beginPath();
                ctx.moveTo(x, y-90);
                ctx.lineTo(x+18, y-112);
                ctx.lineTo(x, y-102);
                ctx.fill();
                ctx.font = "bold 18px monospace";
                ctx.fillStyle = "#ffffcc";
                ctx.fillText("GUERRERO AUREO", x-55, y-105);
            }
            else if(nivel === 4) {
                ctx.fillStyle = "#5f9eff";
                ctx.fillRect(x-28, y-48, 56, 70);
                for(let i=0;i<5;i++) ctx.fillStyle = "#aaddff", ctx.fillRect(x-18+i*9, y-40, 4, 34);
                ctx.fillStyle = "#88ccff";
                ctx.beginPath();
                ctx.ellipse(x, y-64, 24, 28, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#4a80d0";
                ctx.fillRect(x-20, y-88, 40, 28);
                ctx.fillStyle = "#ffffaa";
                ctx.fillRect(x+22, y-62, 12, 54);
                ctx.fillStyle = "#aaddff";
                ctx.beginPath();
                ctx.ellipse(x-36, y-46, 18, 24, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#cceeffaa";
                ctx.beginPath();
                ctx.ellipse(x-42, y-62, 28, 42, -0.8, 0, Math.PI*2);
                ctx.ellipse(x+42, y-62, 28, 42, 0.8, 0, Math.PI*2);
                ctx.fill();
                ctx.font = "bold 20px monospace";
                ctx.fillStyle = "#eef4ff";
                ctx.fillText("CAMPEÓN CELESTIAL", x-75, y-115);
            }
            else if(nivel === 5) {
                ctx.shadowBlur = 25;
                ctx.shadowColor = "#ffaa44";
                ctx.fillStyle = "#ffdd88";
                ctx.fillRect(x-32, y-52, 64, 75);
                for(let i=0;i<6;i++) ctx.fillStyle = "#ffeecc", ctx.fillRect(x-22+i*9, y-42, 4, 36);
                ctx.fillStyle = "#ffcc66";
                ctx.beginPath();
                ctx.ellipse(x, y-68, 28, 32, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#ffaa33";
                ctx.fillRect(x-24, y-94, 48, 32);
                for(let i=0;i<5;i++) {
                    ctx.fillStyle = "#ffdd66";
                    ctx.fillRect(x-20+i*10, y-108, 4, 18);
                }
                ctx.fillStyle = "#ffffaa";
                ctx.fillRect(x+26, y-66, 14, 60);
                ctx.fillStyle = "#ffaa55";
                ctx.fillRect(x+30, y-66-20, 6, 24);
                ctx.fillStyle = "#ffdd99";
                ctx.beginPath();
                ctx.ellipse(x-42, y-46, 22, 28, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.ellipse(x-42, y-46, 12, 18, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#ff6600cc";
                ctx.beginPath();
                ctx.ellipse(x-50, y-68, 32, 50, -0.9, 0, Math.PI*2);
                ctx.ellipse(x+50, y-68, 32, 50, 0.9, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#ffaa44";
                ctx.beginPath();
                ctx.moveTo(x, y-100);
                ctx.lineTo(x+32, y-138);
                ctx.lineTo(x-4, y-122);
                ctx.fill();
                ctx.font = "bold 24px monospace";
                ctx.fillStyle = "#ffffcc";
                ctx.fillText("⚡ GUERRERO DIVINO ⚡", x-85, y-125);
                ctx.font = "bold 18px monospace";
                ctx.fillStyle = "#ffcc77";
                ctx.fillText("★ TRASCENDENTE ★", x-70, y-98);
            }
            
            if(nivel >= 3) {
                ctx.beginPath();
                ctx.ellipse(x, y-35, 55, 70, 0, 0, Math.PI*2);
                ctx.fillStyle = `rgba(255,220,100,${0.1 + nivel*0.03})`;
                ctx.fill();
            }
            ctx.restore();
        }
        
        // ==================== MONSTRUO TERRORÍFICO ====================
        function dibujarMonstruo(x, y, derrotado, guerreroPerdio) {
            if(derrotado) {
                ctx.save();
                ctx.globalAlpha = 0.85;
                ctx.fillStyle = "#2a0a1a";
                ctx.fillRect(x-60, y+25, 120, 55);
                ctx.fillStyle = "#5a1a3a";
                ctx.beginPath();
                ctx.ellipse(x, y+40, 50, 42, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x-35, y+22);
                ctx.lineTo(x-12, y+45);
                ctx.moveTo(x-12, y+22);
                ctx.lineTo(x-35, y+45);
                ctx.moveTo(x+18, y+22);
                ctx.lineTo(x+40, y+45);
                ctx.moveTo(x+40, y+22);
                ctx.lineTo(x+18, y+45);
                ctx.lineWidth = 7;
                ctx.strokeStyle = "#ff0000";
                ctx.stroke();
                ctx.font = "bold 32px monospace";
                ctx.fillStyle = "#ff8888";
                ctx.fillText("💀 ANIQUILADO 💀", x-70, y+12);
                ctx.restore();
                return;
            }
            
            if(guerreroPerdio && !derrotado) {
                ctx.save();
                ctx.fillStyle = "#3a0a2a";
                ctx.beginPath();
                ctx.ellipse(x, y-5, 60, 70, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#ff3333";
                ctx.beginPath();
                ctx.arc(x-28, y-32, 12, 0, Math.PI*2);
                ctx.arc(x+28, y-32, 12, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#000000";
                ctx.beginPath();
                ctx.arc(x-32, y-36, 5, 0, Math.PI*2);
                ctx.arc(x+24, y-36, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#ff0000";
                ctx.beginPath();
                ctx.ellipse(x, y+5, 40, 25, 0, 0, Math.PI*2);
                ctx.fill();
                for(let d=-2;d<=2;d++) {
                    ctx.fillStyle = "#ffffaa";
                    ctx.fillRect(x+d*12, y+2, 5, 14);
                }
                ctx.font = "bold 32px monospace";
                ctx.fillStyle = "#ff6666";
                ctx.fillText("😈 COLOSO VENGADOR", x-125, y-65);
                ctx.restore();
                return;
            }
            
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#ff0000";
            
            let gradMon = ctx.createLinearGradient(x-40, y-30, x+40, y+40);
            gradMon.addColorStop(0, "#3a0a2a");
            gradMon.addColorStop(1, "#5a1a3a");
            ctx.fillStyle = gradMon;
            ctx.beginPath();
            ctx.ellipse(x, y-2, 70, 85, 0, 0, Math.PI*2);
            ctx.fill();
            
            for(let s=0;s<20;s++) {
                ctx.fillStyle = "#8a3060";
                ctx.beginPath();
                ctx.ellipse(x-50+ s*8, y-10 + (s%4)*12, 5, 8, 0, 0, Math.PI*2);
                ctx.fill();
            }
            
            ctx.fillStyle = "#1a0a1a";
            ctx.beginPath();
            ctx.moveTo(x-38, y-55);
            ctx.lineTo(x-65, y-115);
            ctx.lineTo(x-22, y-72);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x+38, y-55);
            ctx.lineTo(x+65, y-115);
            ctx.lineTo(x+22, y-72);
            ctx.fill();
            
            ctx.fillStyle = "#ff0000";
            ctx.shadowBlur = 25;
            ctx.shadowColor = "#ff0000";
            ctx.beginPath();
            ctx.arc(x-30, y-30, 14, 0, Math.PI*2);
            ctx.arc(x+30, y-30, 14, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = "#ffff00";
            ctx.beginPath();
            ctx.arc(x-34, y-34, 5, 0, Math.PI*2);
            ctx.arc(x+26, y-34, 5, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = "#4a0a1a";
            ctx.beginPath();
            ctx.ellipse(x, y+10, 45, 28, 0, 0, Math.PI*2);
            ctx.fill();
            for(let d=-3;d<=3;d++) {
                ctx.fillStyle = "#ffccaa";
                ctx.fillRect(x+d*12, y+5, 6, 18);
            }
            ctx.fillStyle = "#ffffcc";
            ctx.beginPath();
            ctx.moveTo(x-18, y+2);
            ctx.lineTo(x-28, y+20);
            ctx.lineTo(x-10, y+10);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x+18, y+2);
            ctx.lineTo(x+28, y+20);
            ctx.lineTo(x+10, y+10);
            ctx.fill();
            
            ctx.font = "bold 34px monospace";
            ctx.fillStyle = "#ff6666";
            ctx.shadowBlur = 15;
            ctx.fillText("👹 COLOSO ABISAL", x-135, y-75);
            ctx.font = "bold 22px monospace";
            ctx.fillStyle = "#ffaaaa";
            ctx.fillText("EL DEVORADOR DE MUNDOS", x-125, y-45);
            ctx.restore();
        }
        
        function dibujar() {
            dibujarEscenario();
            let warriorX = 170, warriorY = CH-70;
            let monsterX = CW-170, monsterY = CH-70;
            
            if(gamePhase === "questions") {
                dibujarGuerrero(warriorX, warriorY, warriorLevel, false);
                ctx.globalAlpha = 0.3;
                dibujarMonstruo(monsterX, monsterY, false, false);
                ctx.globalAlpha = 1;
                ctx.font = "bold 18px monospace";
                ctx.fillStyle = "#ffdd99";
                ctx.fillText("📐 RESUELVE 5 EJERCICIOS DE CÁLCULO AVANZADO PARA ENFRENTAR AL COLOSO 📐", CW/2-340, 45);
            } 
            else if(gamePhase === "battle") {
                if(battleResult === "win") {
                    dibujarGuerrero(warriorX, warriorY, warriorLevel, false);
                    dibujarMonstruo(monsterX, monsterY, true, false);
                    ctx.font = "900 44px monospace";
                    ctx.fillStyle = "#FFD966";
                    ctx.shadowBlur = 18;
                    ctx.fillText("✨ VICTORIA ÉPICA ✨", CW/2-160, 65);
                } 
                else if(battleResult === "lose") {
                    dibujarGuerrero(warriorX, warriorY, warriorLevel, true);
                    dibujarMonstruo(monsterX, monsterY, false, true);
                    ctx.font = "bold 44px monospace";
                    ctx.fillStyle = "#cc5555";
                    ctx.fillText("💀 DERROTA TRÁGICA 💀", CW/2-170, 70);
                }
            }
        }
        
        function onSubmit() { evaluarRespuesta(); dibujar(); }
        resetBtn.addEventListener('click', () => { reiniciarJuego(); dibujar(); });
        submitBtn.addEventListener('click', onSubmit);
        answerInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') onSubmit(); });
        
        function init() { 
            reiniciarJuego(); 
            setupMathKeyboard();
            dibujar(); 
        }
        init();
    })();
</script>
</body>
